name: Deploy website

# Publishes docs/ to Netlify. Needs two repository secrets:
#   NETLIFY_AUTH_TOKEN  a personal access token from Netlify (User settings → Applications)
#   NETLIFY_SITE_ID     the site's ID (Site configuration → General → Site details)
# Pushes to main go live; pull requests that touch docs/ get a preview deploy.
#
# The download page serves the files of the latest GitHub release. The repository is
# private, so release assets need a login; this workflow copies them into the site
# instead. After "Build image" finishes it runs again, so a new release shows up there.
# The client files are copied too, for docs/install.sh, and the Claude Code plugin is
# packed as a zip with a marketplace.json, so /plugin marketplace add works from the site.
# The highscores API (/api/scores) is a Netlify Function in netlify/, its data in Netlify Blobs.

on:
  push:
    branches: [main]
    paths: ["docs/**", "client/**", "plugin/**", ".claude-plugin/**", "netlify/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["docs/**", "client/**", "plugin/**", ".claude-plugin/**", "netlify/**", ".github/workflows/site.yml"]
  workflow_run:
    workflows: ["Build image"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs get no secrets, so skip them instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and test the highscores function
        working-directory: netlify
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Check that faq.html matches faq.md
        run: |
          (cd app && python3 tools/faq.py ../docs)
          git diff --exit-code docs/faq.html || { echo "::error::docs/faq.html is out of date, run make faq"; exit 1; }
      - name: Add the client, so install.sh works without access to the repository
        run: |
          mkdir -p docs/client
          cp client/tokibot_client.py client/tokibot.sh client/install.py docs/client/
      - name: Add the Claude Code plugin and its marketplace
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then site="https://pr-$PR--claude-gotchi.netlify.app"; else site="https://tokibot.lottes.dev"; fi
          python3 plugin/build.py docs "$site"
      - name: Add the latest release to the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/downloads
          if ! tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null); then
            echo "No release yet, the download page says so."
            exit 0
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir docs/downloads \
            --pattern '*.img.xz' --pattern 'tokibot-app.tar.gz' --pattern 'claudegotchi-app.tar.gz'
          published=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
          python3 - "$tag" "$published" <<'PY'
          import hashlib, json, os, sys
          tag, published = sys.argv[1], sys.argv[2]
          d = "docs/downloads"
          order = ["tokibot-zero2w.img.xz", "tokibot-zerow.img.xz", "tokibot-app.tar.gz",
                   "claudegotchi-zero2w.img.xz", "claudegotchi-zerow.img.xz", "claudegotchi-app.tar.gz"]
          files = []
          for name in sorted(os.listdir(d), key=lambda n: (order.index(n) if n in order else 99, n)):
              h = hashlib.sha256()
              with open(os.path.join(d, name), "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              files.append({"name": name, "size": os.path.getsize(os.path.join(d, name)), "sha256": h.hexdigest()})
          with open(os.path.join(d, "latest.json"), "w") as f:
              json.dump({"version": tag.lstrip("v"), "tag": tag, "published": published, "files": files}, f, indent=2)
          print(json.dumps(files, indent=2))
          PY
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID is not set, skipping the deploy."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx --yes netlify-cli@latest deploy --dir=docs --functions=netlify/functions --no-build \
              --alias="pr-${{ github.event.number }}" --message="PR #${{ github.event.number }}"
          else
            npx --yes netlify-cli@latest deploy --dir=docs --functions=netlify/functions --no-build --prod \
              --message="${{ github.sha }}"
          fi
